[package]
name = "adqa-ui"
version = "0.1.1"
edition = "2021"
description = "Cross-UI (CLI, TUI, and slint) for the ADQA Autonomous Data Quality Agent"
license = "MIT"
repository = "https://github.com/Mohammad-Talaat7/autonomous-data-quality-agent"
homepage = "https://github.com/Mohammad-Talaat7/autonomous-data-quality-agent"
readme = "../README.md"
keywords = ["data-quality", "tui", "agent", "observability"]
categories = ["command-line-utilities", "development-tools"]

[build-dependencies]
slint-build = "1.12"

[dependencies]
# UI
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

# Slint GUI
# Winit backend (direct access for window event hooks)
i-slint-backend-winit = "1.12"
winit = "0.30"
slint = { version = "1.12", default-features = false, features = ["compat-1-2", "std", "backend-winit", "renderer-femtovg"] }

# Misc
open = "5.3"

# Async
tokio = { version = "1.36", features = ["full"] }
futures = "0.3"

# Interop
pyo3 = { version = "0.23", features = ["auto-initialize"] }

# Data
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.7", features = ["v4", "serde"] }
chrono = "0.4"

# Errors
anyhow = "1.0"

# Native file dialog (used by the Load Data button)
rfd = "0.15"

copypasta = "0.10"

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Enable Link Time Optimization
codegen-units = 1   # Reduce parallel code generation units for better optimization
panic = "abort"     # Abort on panic to reduce binary size
strip = true        # Strip symbols from binary

[[bin]]
name = "adqa-cli"
path = "src/cli_main.rs"

[[bin]]
name = "adqa-tui"
path = "tui/main.rs"

[[bin]]
name = "adqa-slint"
path = "src/slint_main.rs"
